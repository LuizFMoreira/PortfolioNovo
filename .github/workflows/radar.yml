name: Radar

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar fontes e gerar resumos
        env:
          # Opcional: sem a chave, o Radar mostra os trechos originais em vez do resumo em pt-BR.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/radar.mjs
      - name: Commitar se mudou
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add src/data/radar.json
          git diff --staged --quiet || (git commit -m "radar: atualização automática" && git push)
